<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos</title>
    <link rel="stylesheet" href="">
</head>
<body>
    <div class="form-card">
        <h2>Contáctanos</h2>
        <p class="subtitle">
            ¿Preguntas, inquietudes, comentarios?<br>
            Tú hablas, nosotros te escuchamos<br>
            Si tienes alguna pregunta o comentario adicional<br>
            ¡nos encantaría saberlo!
        </p>

        <form action="">
            <label for="nombres">Nombres y Apellidos:</label>
            <input type="text" id="nombres" placeholder="Ingresa tus nombres" required>

            <label for="celular">Celular:</label>
            <input type="tel" id="celular" placeholder="Ingresa tus número" required>

            <label for="correo">Correo:</label>
            <input type="email" id="correo" placeholder="Ingresa tu correo" required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" rows="3" placeholder="¡Cuéntanos!"></textarea>

            <p class="libro">Libro de reclamaciones</p>

            <button type="submit" class="btn-enviar">Enviar</button>
        </form>
    </div>
</body>
</html>
